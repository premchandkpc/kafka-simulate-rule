version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: flowrule-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowrule
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NATS JetStream
  nats:
    image: nats:2.10-alpine
    container_name: flowrule-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # Monitoring HTTP
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "nats", "server", "check", "jetstream"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (optional, for caching/distributed locking)
  redis:
    image: redis:7-alpine
    container_name: flowrule-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: flowrule-api
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/flowrule?sslmode=disable
      NATS_URL: nats://nats:4222
      REDIS_ADDR: redis:6379
      APP_ENV: production
      LOG_LEVEL: info
      HTTP_ADDR: :8080
      GRPC_ADDR: :9090
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: flowrule-worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/flowrule?sslmode=disable
      NATS_URL: nats://nats:4222
      REDIS_ADDR: redis:6379
      APP_ENV: production
      LOG_LEVEL: info
      NUM_SHARDS: 4096
      WORKER_ID: worker-1
      MAX_GLOBAL_IN_FLIGHT: 100
      MAX_PER_KEY_QUEUE: 100
      KEY_QUEUE_WORKERS: 1
      BATCH_MODE: none
      BATCH_MAX: 100
      BATCH_WINDOW_MS: 30000
      SCHEDULER_POLL_MS: 5000
      SCHEDULER_BATCH_SIZE: 100
      LEASE_TTL_MS: 30000
      LEASE_RENEWAL_INTERVAL_MS: 10000
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  # Codegen service (for generating contracts on-demand)
  codegen:
    build:
      context: .
      dockerfile: Dockerfile.codegen
    container_name: flowrule-codegen
    volumes:
      - ./examples:/examples
      - ./generated:/generated
    environment:
      GENERATION_OUTPUT_DIR: /generated
    profiles:
      - tools

volumes:
  postgres_data:
  nats_data:
  redis_data:

networks:
  default:
    name: flowrule-network