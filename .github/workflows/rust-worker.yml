name: Rust worker

on:
  pull_request:
    paths:
      - "rust-worker/**"
      - "Dockerfile.worker"
      - ".github/workflows/rust-worker.yml"
  push:
    branches: [main, "feat/**"]
    paths:
      - "rust-worker/**"
      - "Dockerfile.worker"
      - ".github/workflows/rust-worker.yml"

permissions:
  contents: read

jobs:
  rust-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-worker
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-worker
      - name: Run Rust unit tests
        run: cargo test --all-targets
