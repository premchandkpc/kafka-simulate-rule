version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errcheck
    - govet
    - staticcheck
    - gosec
    - errorlint
    - contextcheck
    - bodyclose
    - gocritic
    - revive
  settings:
    depguard:
      rules:
        domain-pure:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: "github.com/flowrule/flowrule/internal"
              desc: "domain imports stdlib only"
        core-no-drivers:
          files:
            - "**/internal/services/**"
            - "**/internal/ports/**"
            - "**/internal/rules/**"
            - "**/internal/runtime/**"
          deny:
            - pkg: "github.com/jackc/pgx"
              desc: "driver in core"
            - pkg: "github.com/nats-io"
              desc: "driver in core"
            - pkg: "go.mongodb.org"
              desc: "driver in core"
            - pkg: "github.com/redis"
              desc: "driver in core"
            - pkg: "github.com/flowrule/flowrule/internal/adapters"
              desc: "core must not see adapters"

issues:
  exclude-rules:
    - path: _test\\.go
      linters:
        - gosec
    - path: cmd/
      linters:
        - gosec

run:
  timeout: 5m
