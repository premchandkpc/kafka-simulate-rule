name: order.placed
version: "1.0"
namespace: com.example.fooddelivery
description: Event emitted when a food order is placed
fields:
  order_id:
    type: string
    description: Unique order identifier
    required: true
  customer_id:
    type: string
    description: Customer who placed the order
    required: true
  restaurant_id:
    type: string
    description: Restaurant fulfilling the order
    required: true
  total_amount:
    type: number
    description: Order total in cents
    required: true
  currency:
    type: string
    description: Currency code
    required: true
    default: "USD"
  items:
    type: array
    description: Food items ordered
    required: true
    items:
      type: object
      properties:
        menu_item_id:
          type: string
          required: true
        name:
          type: string
          required: true
        quantity:
          type: integer
          required: true
        unit_price:
          type: number
          required: true
  delivery_address:
    type: object
    description: Delivery address
    required: true
    properties:
      street:
        type: string
        required: true
      city:
        type: string
        required: true
      state:
        type: string
        required: true
      postal_code:
        type: string
        required: true
  created_at:
    type: string
    format: date-time
    description: Order creation timestamp
    required: true
compatibility: BACKWARD
owner: food-delivery-team
deprecated: false