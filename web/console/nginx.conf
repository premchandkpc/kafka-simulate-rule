server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keep the browser same-origin; Docker service names stay server-side.
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Worker metrics are reachable only through this console proxy, not a host port.
    location /worker-metrics/ {
        proxy_pass http://worker:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /loki/ {
        proxy_pass http://loki:3100/loki/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
